name: CI Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: constructora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/constructora
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migraciones pendientes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Esquema OpenAPI válido
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen de producción
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
